/var/log/remote/*.log {
    daily
    maxsize 32M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    dateext
    dateformat -%Y%m%d-%H%M%S
    sharedscripts
    postrotate
        [ -s /run/rsyslogd.pid ] && kill -HUP "$(cat /run/rsyslogd.pid)" 2>/dev/null || true
    endscript
}
