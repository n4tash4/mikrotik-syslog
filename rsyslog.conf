# rsyslog config for the mikrotik-syslog collector container.
#
# Receives syslog from every RouterOS device (router, switches, APs) and writes
#   /var/log/remote/<host>.log   one file per sending device
#   /var/log/remote/all.log      everything, interleaved (time-correlation)
# /var/log/remote is a RouterOS mount (/storage/syslog/log), so the files are
# also visible in the router's /file menu.
#
# Rotation is NOT done here: syslog.sh runs logrotate (logrotate.conf) on a
# timer and HUPs rsyslogd so it reopens the files.
#
# Ports (match ../mikrotik inventory group_vars system_logging_action.yml):
#   5514/udp  primary (RouterOS remote action remote-port=5514)
#   5514/tcp  for remote-protocol=tcp actions
#   514/udp   standard port, for anything left on the default

global(
  workDirectory="/var/spool/rsyslog"
  maxMessageSize="8k"
  # Reverse-resolve the sender IP; RouterOS auto-creates PTRs for the static
  # *.dids.atasha.net A records, so FROMHOST becomes e.g. hap1.dids.atasha.net.
  net.enableDNS="on"
  # rsyslogd's own status/error messages (no imuxsock in a container).
  processInternalMessages="on"
)

module(load="imudp")
module(load="imtcp" maxSessions="64")

# ---------------------------------------------------------------------------
# Templates
# ---------------------------------------------------------------------------
# Per-host file path. $.host is sanitised in the ruleset below, so a hostile
# or odd PTR can never produce a path outside /var/log/remote.
template(name="perHostFile" type="string" string="/var/log/remote/%$.host%.log")

# One line per message:
#   <receive time, router clock> <host> <message as sent, minus the PRI>
# Receive time is used (not the device's own timestamp) because a freshly
# booted AP logs with a wrong clock until NTP syncs, and correlating events
# across devices needs ONE clock. The device's own text is kept verbatim.
template(name="line" type="string"
  string="%timegenerated:::date-rfc3339% %$.host% %rawmsg-after-pri:::drop-last-lf%\n")

# ---------------------------------------------------------------------------
# Remote input
# ---------------------------------------------------------------------------
ruleset(name="remote" queue.type="LinkedList" queue.size="20000") {
  # Short host name: hap1.dids.atasha.net -> hap1. Bare IPs (no PTR) are kept
  # whole so they don't collapse to "192".
  # (single-quoted: in RainerScript double quotes a bare $ is a parse error)
  set $.host = $fromhost;
  if not re_match($.host, '^[0-9.:]+$') then {
    set $.host = re_extract($.host, '^([^.]+)', 0, 1, $.host);
  }
  if not re_match($.host, '^[A-Za-z0-9][A-Za-z0-9.:_-]*$') then {
    set $.host = "invalid-host";
  }

  action(type="omfile" dynaFile="perHostFile" template="line"
         dynaFileCacheSize="64" createDirs="on"
         fileCreateMode="0640" dirCreateMode="0750")
  action(type="omfile" file="/var/log/remote/all.log" template="line"
         fileCreateMode="0640")
  stop
}

input(type="imudp" port="5514" ruleset="remote")
input(type="imudp" port="514"  ruleset="remote")
input(type="imtcp" port="5514" ruleset="remote")

# ---------------------------------------------------------------------------
# Default ruleset: only rsyslogd's own internal messages land here.
# Written to a file in the same rotated directory; NOT to stdout, because the
# container runs with logging=yes and anything on stdout goes into the
# router's log, which is itself forwarded here (a feedback loop).
# ---------------------------------------------------------------------------
action(type="omfile" file="/var/log/remote/_rsyslogd.log" fileCreateMode="0640")
