# logrotate policy for the collected device logs (/var/log/remote).
#
# Run by syslog.sh every LOGROTATE_INTERVAL_SECONDS (default 900 = 15 min), not
# by cron. Rotation triggers on whichever comes first:
#   - daily       first run after the day rolls over, or
#   - maxsize     the file has grown past 32M (checked every run)
# so a noisy device (e.g. a link-flap storm) can't grow one file without bound
# between daily rotations.
#
# Retention is capped two ways:
#   - rotate 7    at most 7 rotated copies per file, and
#   - maxage 14   rotated copies older than 14 days are deleted regardless.
# Worst case per file is ~32M live + 7 gzipped copies (syslog text compresses
# ~8-10x), so roughly 60M per device on the /storage USB disk.
#
# The state file lives on the persistent mount (see syslog.sh) so "daily" keeps
# its meaning across container restarts and re-adds.

/var/log/remote/*.log {
    daily
    maxsize 32M
    rotate 7
    maxage 14
    missingok
    notifempty
    compress
    # Size-triggered rotations can happen several times a day, so the suffix
    # needs time-of-day to stay unique (and sorts chronologically, which is
    # what logrotate uses to pick the oldest copies to delete).
    dateext
    dateformat -%Y%m%d-%H%M%S
    # Rotate all matching files, then signal rsyslogd ONCE.
    sharedscripts
    postrotate
        # rsyslogd closes its output files on HUP and reopens them on the next
        # message, so no line is lost (copytruncate would race).
        [ -s /run/rsyslogd.pid ] && kill -HUP "$(cat /run/rsyslogd.pid)" 2>/dev/null || true
    endscript
}
